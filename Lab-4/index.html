<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Лабораторна 4</title>
  </head>
  <body>
    <h1>Моя перша HTML-форма</h1>

    <form action="https://httpbin.org/post" method="post">
      <p>
        <label for="user_name">Ім'я:</label>
        <input type="text" id="user_name" name="user_name" />
      </p>

      <p>
        <label for="user_birthdate">Дата народження:</label>
        <input type="date" id="user_birthdate" name="user_birthdate" />
      </p>

      <p>
        <label>
          Імейл:
          <input type="email" name="user_email" />
        </label>
      </p>

      <p>
        <label for="user_message">Повідомлення:</label>
        <textarea
          id="user_message"
          name="user_message"
          rows="4"
          cols="35"
        ></textarea>
      </p>
      <!-- Чекбокси (можна обрати кілька варіантів) -->
      <p><strong>Ваші улюблені напої?</strong></p>
      <p>
        <label
          ><input type="checkbox" name="drinks" value="coffee" /> Кава</label
        ><br />
        <label><input type="checkbox" name="drinks" value="tea" /> Чай</label
        ><br />
        <label><input type="checkbox" name="drinks" value="juice" /> Сік</label
        ><br />
        <label
          ><input type="checkbox" name="drinks" value="water" /> Вода</label
        >
      </p>

      <!-- Радіокнопки (можна обрати лише один варіант — однаковий name обов'язковий) -->
      <p><strong>Моя національність:</strong></p>
      <p>
        <label
          ><input type="radio" name="nationality" value="ukrainian" checked />
          Українець / Українка</label
        ><br />
        <label
          ><input type="radio" name="nationality" value="polish" /> Поляк /
          Полька</label
        ><br />
        <label
          ><input type="radio" name="nationality" value="other" /> Інша</label
        >
      </p>
      <button type="submit">Надіслати</button>
      <button type="reset">Очистити</button>
    </form>
    <hr />

    <picture>
      <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/300/500"
      />
      <img
        src="https://picsum.photos/1000/400"
        alt="Демонстраційне зображення"
      />
    </picture>
  </body>
</html>
